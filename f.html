<!DOCTYPE html>
<html>
    <head>
        <title> </title>
        <style> </style>
        <script type="importmap">{
    "imports": {"js-crc/":"./node_modules/js-crc/src/"}}</script>
        <script type="module">
        import * as decrypt from "./build/decrypt.js";
        import * as mpegts from "./build/mpegts.js";
        import * as nalutil from "./build/nalutil.js";
        import * as util from "./build/util.js";
        document.getElementById("tsfile").addEventListener("change",async function(){
        const f=document.getElementById("tsfile").files[0];
        const tsfile=new mpegts.MPEGTS(await f.bytes());
    const decrypter = new decrypt.Decrypter("https://www.cctv.com", "player_container_player");
    let videoStreamPID = -1;
    
    await decrypter.loadFinished;
    console.log(tsfile);
    // assume there's just one PMT
    for (const stream of tsfile.pmts[0].pmt.streams) {
        if (stream.streamType !== 0x1B)
            continue; // video stream

        videoStreamPID = stream.pid;
        break;
    }

    if (videoStreamPID === -1)
        throw new Error("video stream not found");

        decrypter.beginDecryptSession();
    for (const { pes, indexes } of (tsfile.getPacketsByPID(videoStreamPID))) {
        const nalus = nalutil.splitNALU(pes.payload);

        for (const nalu of nalus){
            try{decrypter.decryptNALU(nalu, pes.dts || pes.pts);}
            catch(e){console.log(nalu,e);return;}
        }

        let newNALU = nalutil.joinNALU(nalus);

        for (const index of indexes) {
            const tsPacket = tsfile.packets[index];
            const offset = tsPacket.header.isContinuePacket ? 0 : pes.payloadStartOffset;
            let bytesToCopy = tsPacket.payload.byteLength;

            if (!tsPacket.payload)
                continue;

            if (tsPacket.payload.byteLength - offset > newNALU.byteLength) {
                if (!tsPacket.adaptionField)
                    tsPacket.adaptionField = new mpegts.MPEGTSPacketAdaptionField;

                tsPacket.adaptionField.length = 184 - 1 - offset - newNALU.byteLength;
                tsPacket.adaptionField.payload = util.concatUint8Arrays(
                    Uint8Array.of(0x00),

                    tsPacket.adaptionField.length ?
                        new Uint8Array(tsPacket.adaptionField.length - 1).fill(0xFF) :
                        new Uint8Array()
                );
                bytesToCopy = newNALU.byteLength + offset;
            }

            tsPacket.payload = util.concatUint8Arrays(
                util.moveSliceUint8Array(tsPacket.payload, 0, offset),
                util.moveSliceUint8Array(newNALU, 0, bytesToCopy - offset)
            );
            newNALU = util.moveSliceUint8Array(newNALU, bytesToCopy - offset);
        }
    }
        decrypter.endDecryptSession();
});
        </script>
    </head>

    <body>
        <input type="file" id="tsfile">
    </body>
</html>
